name: CI Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.19
      - name: Install locked backend dependencies
        run: uv sync --locked --dev
      - name: Run backend tests
        run: uv run --locked pytest
      - name: Compile backend modules
        run: uv run --locked python -m compileall server.py planner.py llm_router.py safety.py gui_actions.py computer_use.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run wake tests
        run: |
          pnpm exec tsc --ignoreConfig --module NodeNext --moduleResolution NodeNext --target ES2020 --outDir "$RUNNER_TEMP/jarvis-wake-tests" src/wake.ts test/wake.test.ts
          node "$RUNNER_TEMP/jarvis-wake-tests/test/wake.test.js"
      - name: Run session tests
        run: |
          pnpm exec tsc --ignoreConfig --module NodeNext --moduleResolution NodeNext --target ES2020 --outDir "$RUNNER_TEMP/jarvis-session-tests" src/session.ts test/session.test.ts
          node "$RUNNER_TEMP/jarvis-session-tests/test/session.test.js"
      - name: Run clap tests
        run: |
          pnpm exec tsc --ignoreConfig --module NodeNext --moduleResolution NodeNext --target ES2020 --outDir "$RUNNER_TEMP/jarvis-clap-tests" src/clap.ts test/clap.test.ts
          node "$RUNNER_TEMP/jarvis-clap-tests/test/clap.test.js"
      - name: Run settings tests
        run: |
          pnpm exec tsc --ignoreConfig --module NodeNext --moduleResolution NodeNext --target ES2020 --outDir "$RUNNER_TEMP/jarvis-settings-tests" src/settings.ts test/settings.test.ts
          node "$RUNNER_TEMP/jarvis-settings-tests/test/settings.test.js"
      - name: Build frontend
        run: pnpm build
